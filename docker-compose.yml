services:
  #Service 1 High Speed Memory(Redis)
  redis-cache:
    image: redis:7-alpine
    container_name: crypto_redis
    ports:
      - "6379:6379"
    restart: always

  #Service 2 Relational Databse (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: crypto_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  #Service #3 Ingestion Processor
  ingestion_processor:
    build: ./backend
    container_name: crypto_ingestion
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
    - ./backend:/backend
    env_file:
    - .env
    depends_on:
    - postgres-db
    - redis-cache

  frontend_dashboard:
    build: ./frontend
    container_name: crypto_dashboard
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - 8501:8501
    volumes:
      - ./frontend:/frontend
    env_file:
      - .env
    depends_on:
      - postgres-db
    
volumes:
  pgdata: